<svg xmlns="http://www.w3.org/2000/svg" width="920" height="562" viewBox="0 0 920 562" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="920" height="562" rx="16" fill="#0f172a"/>
<text x="32" y="46" fill="#f8fafc" font-size="22" font-weight="700">1,000 buyers race for 100 tickets</text>
<text x="32" y="70" fill="#94a3b8" font-size="13">Tickets each strategy sold. Dashed line = tickets that actually exist.</text>
<text x="700" y="92" fill="#94a3b8" font-size="12">req/s</text><text x="780" y="92" fill="#94a3b8" font-size="12">p99</text>
<text x="32" y="117" fill="#e2e8f0" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">NAIVE (read-then-write)</text>
<rect x="250" y="100" width="420" height="24" rx="5" fill="#1e293b"/>
<rect x="250" y="100" width="42.0" height="24" rx="5" fill="#10b981"/>
<rect x="292.0" y="100" width="378.0" height="24" fill="#f43f5e"/>
<text x="662.0" y="117" fill="#0f172a" font-size="13" font-weight="700" text-anchor="end">1000 sold</text>
<line x1="292.0" y1="95" x2="292.0" y2="129" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
<text x="250" y="143" fill="#f43f5e" font-size="12">oversold 900</text>
<text x="700" y="117" fill="#e2e8f0" font-size="14" font-weight="700">1,276</text>
<text x="780" y="117" fill="#e2e8f0" font-size="14">489 ms</text>
<text x="32" y="179" fill="#e2e8f0" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">PESSIMISTIC_LOCK</text>
<rect x="250" y="162" width="420" height="24" rx="5" fill="#1e293b"/>
<rect x="250" y="162" width="42.0" height="24" rx="5" fill="#10b981"/>
<text x="300.0" y="179" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="start">100 sold</text>
<line x1="292.0" y1="157" x2="292.0" y2="191" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
<text x="250" y="205" fill="#10b981" font-size="12">correct</text>
<text x="700" y="179" fill="#e2e8f0" font-size="14" font-weight="700">2,055</text>
<text x="780" y="179" fill="#e2e8f0" font-size="14">371 ms</text>
<text x="32" y="241" fill="#e2e8f0" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">OPTIMISTIC_LOCK</text>
<rect x="250" y="224" width="420" height="24" rx="5" fill="#1e293b"/>
<rect x="250" y="224" width="42.0" height="24" rx="5" fill="#10b981"/>
<text x="300.0" y="241" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="start">100 sold</text>
<line x1="292.0" y1="219" x2="292.0" y2="253" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
<text x="250" y="267" fill="#f59e0b" font-size="12">correct, 184 buyers bounced</text>
<text x="700" y="241" fill="#e2e8f0" font-size="14" font-weight="700">2,114</text>
<text x="780" y="241" fill="#e2e8f0" font-size="14">467 ms</text>
<text x="32" y="303" fill="#e2e8f0" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace">ATOMIC_UPDATE</text>
<rect x="250" y="286" width="420" height="24" rx="5" fill="#1e293b"/>
<rect x="250" y="286" width="42.0" height="24" rx="5" fill="#10b981"/>
<text x="300.0" y="303" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="start">100 sold</text>
<line x1="292.0" y1="281" x2="292.0" y2="315" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 3"/>
<text x="250" y="329" fill="#10b981" font-size="12">correct</text>
<text x="700" y="303" fill="#e2e8f0" font-size="14" font-weight="700">10,528</text>
<text x="780" y="303" fill="#e2e8f0" font-size="14">83 ms</text>
<line x1="32" y1="354" x2="888" y2="354" stroke="#1e293b"/>
<text x="32" y="384" fill="#f8fafc" font-size="16" font-weight="700">500 buyers, 500 tickets (one each)</text>
<rect x="32.0" y="406" width="205.0" height="92" rx="10" fill="#111c33" stroke="#f43f5e" stroke-opacity="0.6"/>
<text x="46.0" y="430" fill="#cbd5e1" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">NAIVE</text>
<text x="46.0" y="462" fill="#f8fafc" font-size="26" font-weight="800">500<tspan fill="#94a3b8" font-size="13" font-weight="400"> / 500 sold</tspan></text>
<text x="46.0" y="484" fill="#f43f5e" font-size="12">475 seats will be sold twice</text>
<rect x="249.0" y="406" width="205.0" height="92" rx="10" fill="#111c33" stroke="#10b981" stroke-opacity="0.6"/>
<text x="263.0" y="430" fill="#cbd5e1" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">PESSIMISTIC_LOCK</text>
<text x="263.0" y="462" fill="#f8fafc" font-size="26" font-weight="800">500<tspan fill="#94a3b8" font-size="13" font-weight="400"> / 500 sold</tspan></text>
<text x="263.0" y="484" fill="#10b981" font-size="12">all 500 sold</text>
<rect x="466.0" y="406" width="205.0" height="92" rx="10" fill="#111c33" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="480.0" y="430" fill="#cbd5e1" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">OPTIMISTIC_LOCK</text>
<text x="480.0" y="462" fill="#f8fafc" font-size="26" font-weight="800">193<tspan fill="#94a3b8" font-size="13" font-weight="400"> / 500 sold</tspan></text>
<text x="480.0" y="484" fill="#f59e0b" font-size="12">307 seats left unsold</text>
<rect x="683.0" y="406" width="205.0" height="92" rx="10" fill="#111c33" stroke="#10b981" stroke-opacity="0.6"/>
<text x="697.0" y="430" fill="#cbd5e1" font-size="12" font-family="ui-monospace,Menlo,Consolas,monospace">ATOMIC_UPDATE</text>
<text x="697.0" y="462" fill="#f8fafc" font-size="26" font-weight="800">500<tspan fill="#94a3b8" font-size="13" font-weight="400"> / 500 sold</tspan></text>
<text x="697.0" y="484" fill="#10b981" font-size="12">all 500 sold</text>
<text x="32" y="528" fill="#64748b" font-size="11">Median of 3 runs. PostgreSQL 14 (embedded), HikariCP pool 20, 200 worker threads, Ryzen 9 7945HX. NAIVE simulates 2 ms of work between read and write.</text>
<text x="32" y="544" fill="#64748b" font-size="11">Absolute numbers depend on hardware; CI re-runs this on PostgreSQL 16 + Redis 7 for every commit. Reproduce it yourself in the Lab.</text>
</svg>