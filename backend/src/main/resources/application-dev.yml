# Zero-dependency local profile: in-memory H2, no Redis required.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:ticketflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    # H2 uses Hibernate's schema generation; Flyway migrations target PostgreSQL.
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

management:
  health:
    # Redis is optional in dev; don't report the app as DOWN without it.
    redis:
      enabled: false

ticketflow:
  idempotency:
    store: memory
