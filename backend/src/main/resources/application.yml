spring:
  application:
    name: ticketflow-backend
  profiles:
    active: dev
  jpa:
    # Entities are only touched inside service-layer transactions.
    open-in-view: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

ticketflow:
  jwt:
    # Local-development fallback only. The prod profile refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiration-ms: 86400000 # 24 hours
  booking:
    order-hold-duration-seconds: 600 # 10-minute payment window
    sweep-interval-ms: 30000
  inventory:
    # Strategy used by the real booking flow: PESSIMISTIC_LOCK | OPTIMISTIC_LOCK | ATOMIC_UPDATE | REDIS_LUA
    strategy: ${INVENTORY_STRATEGY:ATOMIC_UPDATE}
    optimistic-max-retries: 3
    # Simulated work between read and write in the deliberately broken NAIVE strategy.
    naive-think-time-ms: 2
  idempotency:
    store: memory # memory | redis
  lab:
    enabled: ${LAB_ENABLED:true}
    max-stock: 1000
    max-buyers: 1000
    max-threads: 200
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
